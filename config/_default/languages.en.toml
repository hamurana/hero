# ============================================================================
# languages.en.toml — SITE IDENTITY & AUTHOR PROFILE
# ----------------------------------------------------------------------------
# Your identity, styled like blowfish.page. The author block is what the
# "background" homepage layout overlays on the animated background.
# ============================================================================

locale = "en"
label = "English"
weight = 1

# Site title — header, browser tab, footer copyright.
title = "NCW"

[params]
  displayName = "English"
  isoCode = "en"
  rtl = false
  dateFormat = "2 January 2006"
  # Fallback meta description (and WebSite JSON-LD description) for any page
  # that doesn't set its own `description` — was the generic
  # "A personal site built with Hugo and the Blowfish theme.", which is what
  # every post without a front-matter `description:` was actually shipping
  # as its <meta name="description">.
  description = "Neo Wang's personal blog — research-backed writing on health, habits, charisma, investing, and style."
  keywords = ["health", "habits", "charisma", "investing", "style", "self-improvement", "personal blog"]

  # blowfish.page shows a logo image instead of the title text in the header.
  # To do the same, put your logo in assets/img/ and uncomment:
  #logo = "img/logo.png"

[params.author]
  name = "Neo Wang"
  headline = "Welcome to my corner of the web"
  bio = "Writing about things that intrigue me."
  # Avatar shown on the homepage overlay — add assets/img/avatar.jpg and uncomment:
  #image = "img/avatar.jpg"
  links = [
    { github = "https://github.com/hamurana" },
    { email = "mailto:neo.wang@me.com" },
  ]
