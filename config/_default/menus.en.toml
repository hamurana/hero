# ============================================================================
# menus.en.toml — NAVIGATION MENUS
# ----------------------------------------------------------------------------
# Defines the links in the header navigation bar ([[main]]) and the footer
# ([[footer]]). Lower `weight` = appears further to the left.
#
# Docs: https://blowfish.page/docs/configuration/#menus
# ============================================================================

# ---- Header menu -------------------------------------------------------------

[[main]]
  name = "Posts"
  pageRef = "posts"   # links to content/posts/
  weight = 10

[[main]]
  name = "About"
  pageRef = "about"   # links to content/about.md
  weight = 20

[[main]]
  name = "Tags"
  pageRef = "tags"    # taxonomy page generated by Hugo
  weight = 30

# A menu entry can also be an icon-only external link, e.g.:
#[[main]]
#  identifier = "github"
#  pre = "github"     # icon name, see https://blowfish.page/samples/icons/
#  url = "https://github.com/hamurana"
#  weight = 40

# ---- Footer menu --------------------------------------------------------------

[[footer]]
  name = "Tags"
  pageRef = "tags"
  weight = 10
